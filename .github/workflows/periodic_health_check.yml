name: Periodic Health Check

on:
  push:
    branches:
      - main

#on:
#  schedule:
#    - cron: "0 12 * * *"

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://pokedex-6722.fly.dev/health
          follow-redirect: false
          max-attempts: 3
          retry-delay: 5s
